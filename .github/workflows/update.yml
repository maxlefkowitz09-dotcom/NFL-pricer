name: Update NFL data and deploy site
 
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
 
permissions:
  contents: write
  pages: write
  id-token: write
 
concurrency:
  group: pages
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch odds and scores
        run: python scripts/update.py
      - name: Save history to the repo
        run: |
          git config user.name "nfl-pricer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/games.json
          git diff --cached --quiet || (git commit -m "Update odds and scores" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
 
